<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="220" fill="#ffffff" />

  <!-- input card -->
  <rect x="20" y="60" width="180" height="100" rx="8" fill="#f4f4f5" stroke="#e2e2e5" />
  <rect x="40" y="80" width="40" height="40" rx="4" fill="#d8d8db" />
  <path d="M52 96 l6 6 12 -14" stroke="#8a8a8e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="90" y="96" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#111111">Raw footage</text>
  <text x="40" y="138" font-family="Arial, sans-serif" font-size="11" fill="#111111">Kurti name:</text>
  <rect x="40" y="146" width="120" height="16" rx="3" fill="#ffffff" stroke="#d8d8db" />
  <text x="46" y="158" font-family="Arial, sans-serif" font-size="9" fill="#8a8a8e">"Rose Print Set"</text>

  <path d="M210 110 L 275 110" stroke="#111111" stroke-width="1.5" />
  <path d="M 268 103 L 278 110 L 268 117" stroke="#111111" stroke-width="1.5" fill="none" />

  <!-- agent box -->
  <rect x="285" y="65" width="130" height="90" rx="8" fill="#111111" />
  <circle cx="350" cy="98" r="14" fill="#a78bfa" />
  <text x="350" y="103" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">AI</text>
  <text x="350" y="132" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Kurti Video</text>
  <text x="350" y="146" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Agent</text>

  <path d="M425 110 L 490 110" stroke="#111111" stroke-width="1.5" />
  <path d="M 483 103 L 493 110 L 483 117" stroke="#111111" stroke-width="1.5" fill="none" />

  <!-- output: phone with video+caption -->
  <rect x="500" y="40" width="90" height="150" rx="14" fill="#111111" />
  <rect x="507" y="50" width="76" height="110" rx="4" fill="#a78bfa" />
  <path d="M535 95 l10 10 -10 10 v-20z" fill="#ffffff" />
  <rect x="507" y="166" width="76" height="16" rx="3" fill="#f4f4f5" />
  <text x="545" y="177" font-family="Arial, sans-serif" font-size="7" fill="#111111" text-anchor="middle">caption ready</text>

  <text x="20" y="200" font-family="Arial, sans-serif" font-size="11" fill="#8a8a8e">Input: raw footage + kurti name</text>
  <text x="500" y="205" font-family="Arial, sans-serif" font-size="11" fill="#8a8a8e" text-anchor="middle">Output: video + caption</text>
</svg>
