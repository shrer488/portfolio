<svg width="700" height="460" viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="460" fill="#ffffff" />

  <!-- browser chrome -->
  <rect x="90" y="70" width="520" height="320" rx="10" fill="#f4f4f5" stroke="#e2e2e5" />
  <rect x="90" y="70" width="520" height="34" rx="10" fill="#ffffff" />
  <circle cx="110" cy="87" r="5" fill="#e2e2e5" />
  <circle cx="126" cy="87" r="5" fill="#e2e2e5" />
  <circle cx="142" cy="87" r="5" fill="#e2e2e5" />

  <!-- page header -->
  <text x="112" y="124" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111111">Python Challenges</text>

  <!-- filter row -->
  <rect x="112" y="136" width="70" height="18" rx="9" fill="#ffffff" stroke="#d8d8db" />
  <rect x="188" y="136" width="60" height="18" rx="9" fill="#ffffff" stroke="#d8d8db" />
  <rect x="254" y="136" width="50" height="18" rx="9" fill="#ffffff" stroke="#d8d8db" />

  <!-- challenge table -->
  <rect x="112" y="168" width="300" height="180" rx="6" fill="#ffffff" stroke="#e2e2e5" />
  <text x="124" y="188" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8e">TITLE</text>
  <text x="330" y="188" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8e">XP</text>

  <g font-family="Arial, sans-serif" font-size="11" fill="#333333">
    <text x="124" y="212">Is Pass or Fail?</text>
    <text x="330" y="212">10 XP</text>
    <line x1="124" y1="222" x2="400" y2="222" stroke="#f0f0f2" />

    <text x="124" y="240">Index Shuffle</text>
    <text x="330" y="240">30 XP</text>
    <line x1="124" y1="250" x2="400" y2="250" stroke="#f0f0f2" />

    <text x="124" y="268">Can Enter Club?</text>
    <text x="330" y="268">10 XP</text>
    <line x1="124" y1="278" x2="400" y2="278" stroke="#f0f0f2" />

    <text x="124" y="296">Convert to Titlecase</text>
    <text x="330" y="296">30 XP</text>
    <line x1="124" y1="306" x2="400" y2="306" stroke="#f0f0f2" />

    <text x="124" y="324">Median of Two Sorted Arrays</text>
    <text x="330" y="324">300 XP</text>
  </g>

  <!-- leaderboard card -->
  <rect x="426" y="168" width="164" height="180" rx="6" fill="#ffffff" stroke="#e2e2e5" />
  <text x="438" y="188" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8e">LEADERBOARD</text>

  <g font-family="Arial, sans-serif" font-size="11" fill="#333333">
    <circle cx="444" cy="208" r="8" fill="#f4c542" />
    <text x="440" y="212" font-size="9" text-anchor="middle" fill="#111">1</text>
    <text x="460" y="212">R Karthik</text>
    <text x="440" y="234">2</text>
    <text x="460" y="234">Umamaheswari</text>
    <text x="440" y="256">3</text>
    <text x="460" y="256">Nitin V.</text>
  </g>

  <rect x="438" y="300" width="140" height="30" rx="15" fill="#111111" />
  <text x="508" y="319" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Start Challenge</text>

  <!-- caption labels -->
  <text x="90" y="430" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111111">Programiz PRO Challenges</text>
  <text x="90" y="448" font-family="Arial, sans-serif" font-size="11" fill="#8a8a8e">Gamification + community, built to fight a 3-month user lifetime</text>
</svg>
